<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin panel — Usta Top</title><link rel="stylesheet" href="/styles.css"><style>
body{background:#f4f7f5}.login{max-width:410px;margin:8vh auto;background:#fff;border:1px solid #e4eae6;border-radius:18px;padding:28px}.login h1,.top h1{font-family:Manrope,sans-serif}.login label,.form label{display:block;font-size:12px;font-weight:700;margin:13px 0}.login input,.form input,.form select,.form textarea,.toolbar input,.toolbar select,.table select{width:100%;padding:11px;border:1px solid #dce6de;border-radius:8px;background:#fff;margin-top:6px}.layout{display:none;grid-template-columns:220px 1fr;min-height:100vh}.side{background:#153f32;color:#fff;padding:20px}.side h2{font:800 22px Manrope}.nav{display:grid;gap:6px;margin-top:25px}.nav button{border:0;background:transparent;color:#d5e4dc;text-align:left;padding:12px;border-radius:8px;cursor:pointer}.nav button.active,.nav button:hover{background:#ffffff1a;color:#fff}.main{padding:25px;min-width:0}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:20px}.top h1{margin:0;font-size:27px}.top p,.note{font-size:12px;color:#718077}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.stat,.panel{background:#fff;border:1px solid #e4eae6;border-radius:13px;padding:17px}.stat span{font-size:11px;color:#718077}.stat strong{display:block;font:800 28px Manrope;margin-top:8px}.panel{margin-bottom:16px;overflow:hidden}.panel h2{font:800 18px Manrope;margin:0 0 14px}.toolbar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}.toolbar input{flex:1;min-width:160px;margin:0}.toolbar select{width:auto;min-width:140px;margin:0}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:12px;min-width:700px}.table th,.table td{text-align:left;padding:11px 9px;border-bottom:1px solid #edf1ee;vertical-align:middle}.table th{font-size:10px;color:#718077;text-transform:uppercase}.table select{min-width:120px;padding:7px}.btn2{border:1px solid #dce6de;border-radius:7px;background:white;padding:8px 10px;font-size:11px;cursor:pointer}.primary{background:#176b52;color:white;border-color:#176b52}.danger{color:#ae3838}.badge{display:inline-block;padding:5px 8px;border-radius:20px;background:#e8f5ec;color:#27744b;font-size:10px}.badge.pending,.badge.new{background:#fff2d8;color:#8f641e}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px}.full{grid-column:1/-1}.check{display:flex!important;align-items:center;gap:8px}.check input{width:auto}.alert{padding:10px;border-radius:8px;background:#e7f5eb;color:#1e7044;font-size:12px;margin:8px 0}.error{background:#fbe9e9;color:#a62f2f}.hidden{display:none!important}.actions{display:flex;gap:5px;flex-wrap:wrap}.review{padding:14px 0;border-bottom:1px solid #edf1ee;font-size:12px}.review p{color:#68776d;line-height:1.6}.empty{padding:25px;text-align:center;color:#819087;font-size:12px}.footerline{margin-top:20px;font-size:11px;color:#789}.@media(max-width:850px){.layout{grid-template-columns:1fr}.side{padding:12px}.side h2{margin:5px}.nav{display:flex;overflow:auto;margin-top:10px}.nav button{white-space:nowrap}.main{padding:14px}.stats{grid-template-columns:repeat(2,1fr)}.top h1{font-size:22px}}@media(max-width:520px){.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.top{align-items:flex-start;flex-direction:column}.toolbar{display:grid;grid-template-columns:1fr}.toolbar select{width:100%}}
</style></head><body>
<section class="login" id="login"><a class="brand" href="/">🟩 ustatop</a><h1>Admin panelga kirish</h1><p class="note">Ustalar, buyurtmalar va sayt maʼlumotlarini boshqarish.</p><form id="loginForm"><label>Login<input name="username" value="admin" required autocomplete="username"></label><label>Parol<input name="password" type="password" required autocomplete="current-password" placeholder="Admin paroli"></label><button class="btn btn-primary" style="width:100%">Kirish →</button><p id="loginError" class="alert error hidden"></p></form><p class="note">Standart login: <b>admin</b> · Parol: <b>ChangeMe123!</b>. Kirgach parolni almashtiring.</p><a href="/">← Saytga qaytish</a></section>
<div class="layout" id="layout"><aside class="side"><h2>🟩 Usta Top</h2><nav class="nav" id="nav"><button class="active" data-page="dashboard">▦ Dashboard</button><button data-page="masters">♙ Ustalar</button><button data-page="orders">▤ Buyurtmalar</button><button data-page="reviews">☆ Sharhlar</button><button data-page="messages">✉ Xabarlar</button><button data-page="settings">⚙ Sozlamalar</button><button data-page="security">♙ Xavfsizlik</button></nav><p><button class="btn2" id="logout">Chiqish ↪</button> <a style="color:#cbdcd2;font-size:12px" href="/">Saytga qaytish</a></p></aside><main class="main"><header class="top"><div><h1 id="title">Dashboard</h1><p id="subtitle">Platforma statistikasi va tezkor amallar.</p></div><span class="note">Admin: <b id="username">admin</b></span></header><div id="content"></div></main></div><div class="toast" id="toast"></div><script src="/admin.js" defer></script></body></html>
