<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aloqa — Usta Top</title><link rel="stylesheet" href="/styles.css"></head><body><header class="site-header"><a class="brand" href="/">🟩 usta<span class="brand-green">top</span></a><a href="/">Bosh sahifa</a></header><main class="section" style="max-width:700px"><div class="eyebrow">BIZ BILAN BOG‘LANING</div><h1>Aloqa</h1><p class="hero-desc">Savol yoki taklifingizni yuboring.</p><form id="contact" class="modal" style="display:block;max-height:none;box-shadow:none;border:1px solid #e3eae5"><label>Ismingiz<input name="name" required></label><label>Telefon<input name="phone" required></label><label>Email<input name="email" type="email"></label><label>Xabar<textarea name="message" required rows="5"></textarea></label><button class="btn btn-primary">Xabar yuborish →</button><p id="msg" class="note"></p></form></main><script>document.querySelector('#contact').onsubmit=async e=>{e.preventDefault();let m=document.querySelector('#msg');try{let r=await fetch('/api/contact',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.currentTarget)))}),d=await r.json();if(!r.ok)throw Error(d.error);m.textContent=d.message;e.currentTarget.reset()}catch(x){m.textContent=x.message}}</script></body></html><!--  -->
